[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
description = "Evidence-grounded, human-gated agentic incident investigation for CI/CD failures (LangGraph + hybrid retrieval + MCP)."
requires-python = ">=3.10"
dependencies = ["retrievallab", "langgraph", "fastapi", "uvicorn", "pydantic", "httpx", "mcp<2", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faultline = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
